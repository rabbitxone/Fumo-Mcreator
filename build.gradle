buildscript {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

apply plugin: "fabric-loom"

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.fork = true
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.jar {
	from("License.txt") {
		rename { "LICENSE_fumo.txt" }
	}
}

tasks.register("printCompileClasspath") {
	doLast {
		println("=== compileClasspath files (size in bytes) ===")
		sourceSets.main.compileClasspath.files.each { println("${it.length()}\t${it}") }
		println("=== end compileClasspath files ===")
	}
}

tasks.named("compileJava") {
	doFirst {
		println("=== compileJava actual classpath at execution time (size in bytes) ===")
		classpath.files.each { println("${it.length()}\t${it}") }
		println("=== end compileJava classpath ===")
	}
}
